[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-shield"
version = "0.1.0"
description = "Zero-dependency security scanner for Model Context Protocol (MCP) servers — catches tool poisoning, invisible Unicode smuggling, tool shadowing, supply-chain risks, and secret leaks."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Enis Doğan", email = "enis-dogan@outlook.com"}
]
keywords = ["mcp", "model-context-protocol", "security", "prompt-injection", "tool-poisoning", "sarif", "ai-security", "sast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
mcp-shield = "mcp_shield.cli:main"

[project.urls]
Homepage = "https://github.com/ensibey/mcp-shield"
Repository = "https://github.com/ensibey/mcp-shield"
Issues = "https://github.com/ensibey/mcp-shield/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
