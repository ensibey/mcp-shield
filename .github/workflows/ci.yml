name: mcp-shield CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package & pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run full pytest suite
        run: pytest -v tests/
      - name: Run OWASP-LLM / MCP Security Benchmark
        run: python benchmarks/run_benchmark.py
      - name: Verify CLI on hardened example
        run: mcp-shield scan examples/hardened_mcp.json --fail-on LOW
